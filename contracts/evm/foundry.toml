[profile.default]
src = "src"
out = "out"
libs = ["lib", "dependencies"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
fuzz = { runs = 256 }
fs_permissions = [{ access = "read", path = "./" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
ignore = ["lib/**"]

# Ankr RPC — public endpoints by default; override via env or foundry profiles.
# With a key: https://rpc.ankr.com/<slug>/$ANKR_API_KEY
[rpc_endpoints]
eth = "https://rpc.ankr.com/eth"
sepolia = "https://rpc.ankr.com/eth_sepolia"
base = "https://rpc.ankr.com/base"
base_sepolia = "https://rpc.ankr.com/base_sepolia"
arbitrum = "https://rpc.ankr.com/arbitrum"
optimism = "https://rpc.ankr.com/optimism"
polygon = "https://rpc.ankr.com/polygon"
